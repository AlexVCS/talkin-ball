<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f15a29" />
    <script>
      (() => {
        let preference;
        try {
          preference = localStorage.getItem("talkin-ball-theme");
        } catch {}
        const theme =
          preference === "light" || preference === "dark"
            ? preference
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta
      name="description"
      content="The game has a language. Learn it. A basketball dictionary with visual play breakdowns and timestamped clips from the people who know it best."
    />
    <link rel="icon" type="image/svg+xml" href="/ball.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link
      rel="manifest"
      href="/manifest.webmanifest"
      crossorigin="use-credentials"
    />
    <title>Talkin’ Ball — The game has a language.</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
